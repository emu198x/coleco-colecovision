# coleco-colecovision: The ColecoVision family: its shared wiring, the NTSC and PAL boards, and the headless runtime.
#
# Moved out of emu198x/emu198x with its history on 2026-11-03,
# under knowledge/decisions/workspace-shape.md there: one repository per CPU,
# chip and system family, published, so the rest of the family and its
# siblings take it from crates.io.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "GPL-2.0-or-later"
homepage = "https://emu198x.github.io/"
repository = "https://github.com/emu198x/coleco-colecovision"

[workspace.dependencies]
emu198x-shell = "0.44.2"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
lto = "thin"
codegen-units = 1
